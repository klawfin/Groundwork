name: CI

# Every push and every PR. The unit suite needs no services, so the fast job
# gives an answer in about a minute; the integration job spins up a real
# Postgres because that is where every serious defect in this project has been.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default. Jobs that need more ask for it by name.
permissions:
  contents: read

concurrency:
  # A new push supersedes the run in flight. Nobody reads the results of a
  # commit that has already been replaced.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned deliberately. "latest" turns an unrelated upstream release into a
  # red build on somebody else's Tuesday.
  NODE_VERSION: '22'
  PNPM_VERSION: '10.13.1'

jobs:
  # ---------------------------------------------------------------------------
  # Fast gate. Fails in ~60s on the things that are cheap to check.
  # ---------------------------------------------------------------------------
  verify:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        # --frozen-lockfile: CI must build what the lockfile says, not resolve
        # something new. A CI that silently upgrades is a CI that tests a tree
        # nobody has.
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and pipeline tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Build-time only. The app validates real env at runtime; these exist
          # so `next build` can statically analyse without a live project.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-time-placeholder

  # ---------------------------------------------------------------------------
  # Integration. Real Postgres, real migrations, real RLS.
  #
  # This job is the reason CI exists. Every defect that reached a running system
  # in this project lived in a seam between the application and the database -
  # a trigger, a policy, a constraint - and none of them were visible to the
  # job above.
  # ---------------------------------------------------------------------------
  integration:
    name: Integration (real database)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      # For the authenticated ghcr.io login below. Read-only.
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: latest

      - name: Start Supabase
        # Only the services the integration tests touch: Postgres, auth, REST,
        # the Kong gateway in front of them, and storage (the RLS suite asserts
        # the reports bucket is private).
        #
        # A bare `supabase start` pulls thirteen images, and a Dependabot run
        # once failed on nothing but `toomanyrequests` from the registry while
        # pulling logflare and realtime - services no test here uses. Every
        # image not pulled is one fewer way for CI to go red for a reason that
        # has nothing to do with the code.
        #
        # AUTHENTICATED, AND RETRIED. Trimming images was not enough: the next
        # run still hit `toomanyrequests` from ghcr.io. The images are public,
        # so the pulls were anonymous, and anonymous pulls from a shared runner
        # IP share one rate limit with every other anonymous job on it. Logging
        # in with the job's own read-only token moves the pulls onto this
        # repository's own allowance. The retry absorbs what is left.
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for attempt in 1 2 3; do
            supabase start -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor && exit 0
            echo "::warning::supabase start failed (attempt $attempt of 3), retrying in 30s"
            supabase stop --no-backup || true
            sleep 30
          done
          exit 1

      - name: Verify every migration applied
        # `supabase start` applies migrations. If one failed it would be easy to
        # miss in the log, so assert the schema afterwards rather than trusting
        # a zero exit code.
        run: |
          supabase db diff --schema public > /tmp/drift.txt 2>&1 || true
          if grep -qi "create table\|alter table" /tmp/drift.txt; then
            echo "::error::Schema drift between migrations and the running database"
            cat /tmp/drift.txt
            exit 1
          fi

      - name: Every table the app writes to has a write policy
        # The same assertion the deploy runs, run here too, because here is
        # where it is cheap. Two tables silently could not be written for the
        # entire life of the project; nothing failed, nothing logged, and the
        # build stayed green the whole time.
        run: psql -v ON_ERROR_STOP=1 -f scripts/assert-write-policies.sql "$DB_URL"
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Integration tests
        run: pnpm test:integration

      - name: Stop Supabase
        if: always()
        run: supabase stop

  # ---------------------------------------------------------------------------
  # Security and supply chain. Blocking on committed secrets, on real-looking
  # personal data, and on high or critical advisories in production
  # dependencies. Lower-severity flaws are tracked by security-flaws.yml.
  # ---------------------------------------------------------------------------
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Needed by the secret scan, and its absence failed this job on EVERY
      # pull request - not only Dependabot's - with `403 Resource not
      # accessible by integration`. On a pull request gitleaks lists the PR's
      # commits through the API to know what to scan; on a push to main it
      # does not, which is why main stayed green and hid it. Read-only.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Secret scanning needs history, not just the tip.
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Dependency audit (production, high and critical)
        # BLOCKING, since SA-10. This was `|| true` while Dependabot was the
        # thing watching for flaws. With Dependabot gone, a merge that ships a
        # known high-severity flaw in code that runs in production has to stop
        # here - the weekly tracker (security-flaws.yml) reports, it does not
        # prevent.
        #
        # Production dependencies only, and high and above only: a moderate
        # advisory in a test runner is tracked in the weekly issue, not allowed
        # to block a fix to a client's report on the day it is needed.
        run: pnpm audit --prod --audit-level high

      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: No real client data in the repo
        # readme.md rule 9. Fixtures are fabricated; a real company name or a
        # real email in a fixture is a data-protection incident, not a typo.
        run: |
          if grep -rniE '@(gmail|outlook|yahoo|hotmail)\.com' \
               --include='*.ts' --include='*.tsx' --include='*.sql' \
               packages apps supabase 2>/dev/null; then
            echo "::error::A real-looking personal email address is committed. Fabricate test data."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # The palette constraint, enforced.
  #
  # The brand kit is seven colours. A Tailwind default sneaking back in is not a
  # visual nitpick - it is the design system quietly ceasing to be true, and it
  # is invisible in review because the diff looks like any other class change.
  # ---------------------------------------------------------------------------
  design-tokens:
    name: Palette
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: No legacy Tailwind colour classes
        run: pnpm check:palette

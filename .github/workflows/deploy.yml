name: Release

# VERCEL BUILDS AND RELEASES THE APP; THIS WORKFLOW DOES WHAT VERCEL CANNOT.
#
# The app ships through Vercel's GitHub integration: every push to main is
# built, and Vercel's Deployment Checks hold that build back from
# groundwork.klawfin.com until CI and SA-10 have passed for the commit. An
# earlier version of this file also deployed with the Vercel CLI, which meant
# two production paths for one app.
#
# What is left for this workflow, run by hand:
#
#   1. apply database migrations - Vercel has no access to the database, and
#      a migration is the one change here that cannot be rolled back by
#      redeploying an older build;
#   2. verify what is actually live: health, security headers, the auth
#      guard, and that the live build is the approved commit.
#
# ORDER, when a commit changes the schema: migrations must be backward
# compatible (add, never rename or drop in the same release), because Vercel
# may promote the new build before or after this workflow runs. Push the
# migration, run this, then push the code that depends on it.
on:
  workflow_dispatch:

# Least privilege: read the repository and nothing more. Secrets are scoped by
# the GitHub `production` environment, not by this token.
permissions:
  contents: read

concurrency:
  # Never two releases at once. Migrations are not reentrant.
  group: release-production
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.13.1'

jobs:
  gate:
    name: Re-verify before shipping
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # To read this commit's CI and SA-10 results. Read-only.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The ancestry check below needs history, not just the tip.
          fetch-depth: 0

      - name: Only approved commits deploy
        # NIST SA-10(c): implement only organization-approved changes.
        #
        # This repository commits straight to main - there is no pull request
        # to approve. "Approved" therefore means three things, all checked
        # here against this exact commit:
        #
        #   1. it is on main;
        #   2. its CI run passed - lint, types, unit, integration, security;
        #   3. its SA-10 run passed - including the Security-Impact change
        #      record for configuration items.
        #
        # The same two workflows are the Deployment Checks Vercel waits for
        # before putting a build on the domain, so the database and the app
        # are released on the same definition of "approved".
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF ($GITHUB_SHA) is not on main. Only commits on main can be released."
            exit 1
          fi

          for workflow in ci.yml sa10.yml; do
            result=$(gh run list --workflow "$workflow" --commit "$GITHUB_SHA" --event push \
                       --json conclusion -q '.[0].conclusion // "none"')
            if [ "$result" != "success" ]; then
              echo "::error::$workflow for $GITHUB_SHA is '$result', not 'success'. Only commits that passed CI and SA-10 can be released."
              exit 1
            fi
            echo "$workflow passed for $GITHUB_SHA"
          done
          echo "$GITHUB_SHA is on main and verified - approved for release."
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  migrate:
    name: Database migrations
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with: { version: latest }

      - name: Link the production Supabase project
        # Every `--linked` command below reads the project ref that
        # `supabase link` writes into supabase/.temp/ - which is gitignored, so
        # a fresh runner has nothing linked. Without this step `db push` dies
        # with "Cannot find project ref" on the first real release.
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          # Not a secret: the ref is visible in the project's public URL.
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

      - name: Show what would change
        # DRY RUN FIRST, in the log, before anything is applied. A migration
        # that drops a column is indistinguishable from one that adds an index
        # until somebody reads the diff.
        run: supabase db push --linked --dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Apply
        run: supabase db push --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Verify write policies survived
        # Migrations have removed a policy before, and an RLS gap is SILENT:
        # the write returns success and stores nothing. Asserted here rather
        # than discovered from an empty table weeks later. psql, not the
        # Supabase CLI, which has no arbitrary-SQL command.
        run: psql -v ON_ERROR_STOP=1 -f scripts/assert-write-policies.sql "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

  verify:
    name: Verify what is live
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Health, headers and auth guard
        # Three things, all of which have broken before:
        #   - the app can reach its database
        #   - security headers are actually served
        #   - an unauthenticated request is redirected, not served
        run: |
          set -euo pipefail
          BASE="${{ vars.APP_URL }}"

          echo "health:"
          curl -sf "$BASE/api/health" | tee /tmp/health.json
          grep -q '"database":"ok"' /tmp/health.json

          echo "headers:"
          # Here-strings, not `echo | grep -q`: under pipefail, grep -q exiting
          # on its first match can kill echo with SIGPIPE and fail the step on
          # a good release.
          HEADERS=$(curl -sI "$BASE/login")
          grep -qi 'strict-transport-security' <<< "$HEADERS" || { echo "::error::HSTS missing"; exit 1; }
          grep -qi 'x-frame-options: DENY'      <<< "$HEADERS" || { echo "::error::X-Frame-Options missing"; exit 1; }
          if grep -qi 'x-powered-by' <<< "$HEADERS"; then echo "::error::X-Powered-By is leaking"; exit 1; fi

          echo "auth guard:"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/clients")
          [ "$CODE" = "307" ] || [ "$CODE" = "302" ] || { echo "::error::/clients served $CODE unauthenticated"; exit 1; }

          echo "all checks passed"

      - name: Deployed version is the approved commit
        # NIST SA-10(5) and (6): what is serving traffic is exactly the commit
        # that passed the gate. The commit is baked into the build
        # (BUILD_COMMIT_SHA in next.config.ts, from Vercel's git metadata) and
        # reported by /api/health.
        #
        # WAITS rather than failing at once: Vercel promotes a build only after
        # its Deployment Checks pass, which can finish after this workflow
        # starts. Ten minutes without a match means Vercel is holding the build
        # back - look at the deployment's checks in the Vercel dashboard.
        #
        # `curl -s`, not `-sf`: a 503 from a degraded database still carries
        # the version, and -f would throw it away.
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            SERVING=$(curl -s "${{ vars.APP_URL }}/api/health" | jq -r '.version // "unreported"')
            if [ "$SERVING" = "$GITHUB_SHA" ]; then
              echo "Serving $SERVING - matches the approved commit."
              exit 0
            fi
            echo "live: $SERVING, waiting for $GITHUB_SHA (attempt $attempt of 20)"
            sleep 30
          done
          echo "::error::Production is still serving '$SERVING' after 10 minutes; the approved commit is $GITHUB_SHA."
          exit 1

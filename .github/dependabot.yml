version: 2

# Weekly, grouped, and deliberately quiet.
#
# A team of four does not have the attention for twelve separate PRs a week.
# Grouping means one PR to review; a weekly cadence means it lands when someone
# is looking. Security updates are separate and unbatched, because those are
# the ones worth interrupting for.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      # Anything that moves together should land together - a Next bump without
      # its eslint-config sibling just fails CI.
      next:
        patterns: ['next', '@next/*', 'eslint-config-next', 'react', 'react-dom', '@types/react*']
      dev-tooling:
        patterns: ['eslint*', '@eslint/*', 'typescript*', 'vitest', '@vitest/*', 'prettier*']
      minor-and-patch:
        update-types: ['minor', 'patch']
    ignore:
      # Pinned on purpose. The SDK's structured-output helper is typed against
      # a specific zod major; an automatic bump breaks the build in a way that
      # reads as unrelated.
      - dependency-name: 'zod'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
